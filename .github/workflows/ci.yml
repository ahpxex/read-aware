# Pull-request and main gate for every workspace.
#
# capabilities.yml stays the capability-program gate (check:capabilities and the
# three-OS `cargo test --locked --lib` native contracts); this workflow does not
# repeat those runs.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: typecheck, tests and boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      # turbo builds what each task needs: the foliate runtime inside the web
      # scripts, jumper's bundle and the landing site before their tests.
      - run: bun run typecheck
      - name: Lint (type-aware oxlint and swallowed promise rejections)
        run: bun run lint
      - name: Formatting (Biome)
        run: bun run format:check
      - run: bun run test
      - name: Web build (runs the dist engine-syntax guard for issue #41)
        run: bun run build
      - name: Dependency boundaries (ratchet against the recorded baseline)
        run: bun run lint:deps
      - run: bun run check:docs
      - name: Reject tracked generation drift
        run: git diff --exit-code

  reader-runtime:
    name: reader runtime regressions (headless Chrome)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - name: Run tests/runtime suites against the emitted engine
        working-directory: apps/web
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: bun run test:runtime

  rust:
    name: rustfmt, clippy and vendored crates
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils shared-mime-info desktop-file-utils
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri
          key: ci-rust
          cache-on-failure: true
      - name: Formatting
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check
      - run: bun install --frozen-lockfile
      - name: Prepare embedded plugins for native compilation
        run: bun run --filter @read-aware/plugin-dictionary --filter @read-aware/plugin-editorial-themes --filter @read-aware/plugin-rss-reader --filter @read-aware/plugin-sentence-reader --filter @read-aware/plugin-tts --filter @read-aware/plugin-jumper build
      - name: Clippy (library and tests, warnings are errors)
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --lib --tests --locked -- -D warnings
      - name: Vendored auto-launch patch (resolved through patch.crates-io)
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked -p auto-launch

  vendored-crates:
    name: vendored auto-launch on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux runs in the rust job; the macOS and Windows startup-entry encoders
        # are compiled only on their own targets.
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri
          key: ci-vendored-${{ matrix.os }}
          cache-on-failure: true
      - name: Vendored auto-launch patch (resolved through patch.crates-io)
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked -p auto-launch
