name: desktop-preferences
on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/src-tauri/src/file_associations/**"
      - "apps/desktop/src-tauri/src/desktop_preferences.rs"
      - "apps/desktop/src-tauri/src/desktop_startup.rs"
      - "apps/desktop/src-tauri/src/external_open.rs"
      - "apps/desktop/src-tauri/Cargo.*"
      - "apps/desktop/src-tauri/tauri*.json"
      - "apps/desktop/src-tauri/windows/**"
      - "apps/desktop/tests/file-associations.nsi"
      - ".github/workflows/desktop-preferences.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-contracts:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Compile uninstall hook without installing or launching it
        working-directory: apps/desktop/tests
        run: |
          $compiler = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (!(Test-Path $compiler)) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $hook = (Resolve-Path ..\src-tauri\windows\file-associations.nsh).Path
          & $compiler "/DHOOK=$hook" "/DOUTPUT=$env:RUNNER_TEMP\readaware-association-hook-test.exe" file-associations.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: apps/desktop/src-tauri
          key: windows-preferences
          cache-on-failure: true
      - run: bun install --frozen-lockfile
      - name: Prepare embedded production plugins for native compilation
        run: bun run --filter @read-aware/plugin-dictionary --filter @read-aware/plugin-editorial-themes --filter @read-aware/plugin-rss-reader --filter @read-aware/plugin-sentence-reader --filter @read-aware/plugin-tts --filter @read-aware/plugin-jumper build
      - name: Native preference correctness tests (no desktop launch)
        working-directory: apps/desktop/src-tauri
        run: |
          cargo test --locked --lib file_associations
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --lib desktop_
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --lib external_open
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
