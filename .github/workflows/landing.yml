# Deploys readaware.app (apps/landing → the read-aware-site Worker) on every
# push that touches the site or the workspace packages it builds against.
#
# Exists because the Workers cutover (bd41978) ended the CF-Pages era of
# "push and the site updates itself" — this restores that contract. The
# monorepo build must run from the repo root (landing depends on
# @read-aware/core and @read-aware/ui via workspace:*), which is also why
# Cloudflare's own Workers Builds (root-directory-scoped) wasn't used.
#
# Manual escape hatch stays: `cd apps/landing && bun run deploy` locally, or
# trigger this via workflow_dispatch.
name: landing

on:
  push:
    branches: [main]
    paths:
      - "apps/landing/**"
      - "packages/ui/**"
      - "packages/core/**"
      - "bun.lock"
      - ".github/workflows/landing.yml"
  workflow_dispatch:

concurrency:
  group: landing-deploy
  # Do not cancel between deployment and changed-URL notification.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build (vite + SSR prerender + typecheck)
        working-directory: apps/landing
        run: bun run build
      - name: Verify static navigation, downloads, and screenshots
        working-directory: apps/landing
        run: bun run test:static
      - name: Restore last acknowledged IndexNow manifest
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/readaware-search-ack.json
          key: readaware-indexnow-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: readaware-indexnow-
      - name: Snapshot currently published search pages
        working-directory: apps/landing
        run: bun scripts/indexnow.mjs snapshot "$RUNNER_TEMP/readaware-search-before.json" "$RUNNER_TEMP/readaware-search-ack.json"
      - name: Keep notification snapshot for recovery
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-before-${{ github.run_attempt }}
          path: ${{ runner.temp }}/readaware-search-before.json
          retention-days: 30
      - name: Deploy to Cloudflare Workers
        working-directory: apps/landing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a657a3e85e3a60cc228b04ba1966c656
        run: bunx wrangler deploy
      - name: Verify production and notify IndexNow of changed URLs
        working-directory: apps/landing
        run: bun scripts/indexnow.mjs submit "$RUNNER_TEMP/readaware-search-before.json" "$RUNNER_TEMP/readaware-search-ack.json"
      - name: Save acknowledged IndexNow manifest
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/readaware-search-ack.json
          key: readaware-indexnow-${{ github.run_id }}-${{ github.run_attempt }}
