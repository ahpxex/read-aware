# Release builds — run ONLY when a version tag (v*) is pushed.
# Android: signed arm64 APK. iOS: unsigned arm64 IPA for sideloading (AltStore
# / SideStore / Sideloadly re-sign it with the user's own Apple ID). Desktop:
# macOS .dmg/.app.zip per chip (Apple Silicon + Intel, no universal), Windows
# x64 .msi/.exe, Linux x64 .AppImage/.deb/.rpm. Every artifact is renamed to carry its platform
# (ReadAware-vX.Y.Z-<platform>-<arch>.<ext>) before it is attached to the
# GitHub release for the tag (created on first upload). Stable releases
# additionally upload every installer under a version-less stable alias
# (ReadAware-<platform>-<arch>.<ext>) so the landing page can hard-code
# `releases/latest/download/<alias>` URLs without calling the rate-limited
# GitHub API — keep the alias names in sync with
# apps/landing/src/lib/releases.ts (DOWNLOADS). Pre-release tags (any v*
# containing "-", e.g. v0.3.0-beta.1) skip the aliases and mark the GitHub
# release as a prerelease, which keeps it out of `releases/latest` entirely:
# the desktop updater (latest.json), the Android updater (latest-android.json)
# and the landing's alias links all keep resolving to the previous stable
# release. The updater-manifest job then assembles latest.json from the
# uploaded updater payloads.
#
# Android signing comes from two repository secrets:
#   ANDROID_KEYSTORE_B64      — base64 of the release keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD — store/key password (alias is "readaware")
# Desktop updater artifacts are signed through TAURI_SIGNING_PRIVATE_KEY and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD. The matching public key is embedded in
# tauri.conf.json. macOS OS-level code signing + notarization come from six
# repository secrets consumed by the tauri CLI during `tauri build`:
#   APPLE_CERTIFICATE          — base64 of the Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD — password of that .p12 export
#   APPLE_SIGNING_IDENTITY     — "Developer ID Application: <name> (<team id>)"
#   APPLE_API_ISSUER           — App Store Connect API issuer id (UUID)
#   APPLE_API_KEY              — App Store Connect API key id
#   APPLE_API_KEY_B64          — base64 of the API key .p8 private key
# The CLI imports the certificate into a throwaway keychain, signs the .app
# with the hardened runtime, submits it to Apple's notary service, waits, and
# staples the ticket before the DMG is assembled — so the DMG, the .app zip
# and the updater .app.tar.gz all carry the same notarized bundle. A verify
# step asserts Gatekeeper acceptance so an unsigned build fails the job
# instead of shipping silently. Windows/Linux OS signing is still not
# configured.
#
# Every `uses:` is pinned to a full commit SHA with the human-readable version
# in a trailing comment — a floating tag like `@v3` can be repointed at any
# commit by whoever owns the action, and these jobs hold `contents: write`, the
# Android keystore, and the updater signing key. Dependabot (.github/dependabot.yml)
# bumps the SHAs and rewrites the comment. dtolnay/rust-toolchain normally
# selects its toolchain from the ref name (`@stable`), which a SHA pin destroys,
# so every use passes `toolchain: stable` explicitly instead.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  NDK_VERSION: 28.2.13676358

jobs:
  marketplace-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify the production marketplace against this release
        run: bun run check:marketplace

  android:
    needs: marketplace-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require signing secrets
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_B64 }}" ] || [ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ]; then
            echo "ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD secrets are missing" >&2
            exit 1
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install NDK
        run: sdkmanager "ndk;${{ env.NDK_VERSION }}"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches the Android app version
        run: |
          APP_VERSION="$(bun -e "console.log(require('./apps/desktop/src-tauri/tauri.conf.json').version)")"
          if [ "${GITHUB_REF_NAME#v}" != "$APP_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match tauri.conf.json version $APP_VERSION" >&2
            exit 1
          fi

      - name: Configure signing
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > apps/desktop/src-tauri/gen/android/keystore.properties <<EOF
          keyAlias=readaware
          password=$ANDROID_KEYSTORE_PASSWORD
          storeFile=$RUNNER_TEMP/release.jks
          EOF

      - name: Build APK (arm64 release)
        working-directory: apps/desktop
        run: NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION" bun run tauri android build --apk --target aarch64

      - name: Prepare update artifacts
        run: |
          APK="ReadAware-${{ github.ref_name }}-android-arm64.apk"
          cp apps/desktop/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose "$APK"
          VERSION="$(bun -e "console.log(require('./apps/desktop/src-tauri/tauri.conf.json').version)")"
          VERSION_CODE="$(bun -e "console.log(require('./apps/desktop/src-tauri/tauri.conf.json').bundle.android.versionCode)")"
          SHA256="$(sha256sum "$APK" | cut -d ' ' -f 1)"
          SIZE="$(stat -c %s "$APK")"
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${APK}"
          VERSION="$VERSION" VERSION_CODE="$VERSION_CODE" SHA256="$SHA256" SIZE="$SIZE" APK_URL="$APK_URL" \
            bun -e 'console.log(JSON.stringify({ version: process.env.VERSION, versionCode: Number(process.env.VERSION_CODE), url: process.env.APK_URL, sha256: process.env.SHA256, size: Number(process.env.SIZE) }, null, 2))' \
            > latest-android.json
          if [[ "$GITHUB_REF_NAME" != *-* ]]; then
            cp "$APK" ReadAware-android-arm64.apk
          fi

      - name: Attach to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: ReadAware ${{ github.ref_name }}
          files: |
            ReadAware-*android-arm64.apk
            latest-android.json
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  # iOS: unsigned arm64 IPA via `tauri ios build --no-sign` (the CLI overrides
  # the codesigning identity to "" and still runs beforeBuildCommand plus the
  # Rust build through its Xcode options server, so the whole pipeline stays
  # the supported one). The IPA carries no signature at all — sideloading
  # tools (AltStore, SideStore, Sideloadly) re-sign it on install.
  ios:
    needs: marketplace-contract
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri
          key: aarch64-apple-ios

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches the iOS app version
        run: |
          APP_VERSION="$(bun -e "console.log(require('./apps/desktop/src-tauri/tauri.conf.json').version)")"
          if [ "${GITHUB_REF_NAME#v}" != "$APP_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match tauri.conf.json version $APP_VERSION" >&2
            exit 1
          fi
          PLIST="apps/desktop/src-tauri/gen/apple/read-aware-desktop_iOS/Info.plist"
          IOS_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"
          if [ "${GITHUB_REF_NAME#v}" != "$IOS_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match iOS Info.plist version $IOS_VERSION" >&2
            exit 1
          fi

      - name: Build unsigned IPA
        working-directory: apps/desktop
        run: bun run tauri ios build --no-sign --ci

      # The tauri CLI runs xcodebuild with -quiet, so an archive failure hides
      # the real error (script-phase output included). The activity log has it.
      - name: Dump Xcode activity logs on failure
        if: failure()
        run: |
          find "$HOME/Library/Developer/Xcode/DerivedData" -name "*.xcactivitylog" 2>/dev/null | while read -r log; do
            echo "=== $log ==="
            gunzip -c "$log" | tr '\r' '\n' | tail -300 || true
          done

      - name: Collect release assets
        run: |
          IPA="apps/desktop/src-tauri/gen/apple/build/arm64/ReadAware.ipa"
          unzip -q "$IPA" -d "$RUNNER_TEMP/ipa-check"
          codesign -dv "$RUNNER_TEMP/ipa-check/Payload/ReadAware.app" 2>&1 | grep -q "not signed" \
            || { echo "expected an unsigned IPA" >&2; exit 1; }
          mkdir -p release-assets
          cp "$IPA" "release-assets/ReadAware-${{ github.ref_name }}-ios-arm64.ipa"
          if [[ "$GITHUB_REF_NAME" != *-* ]]; then
            cp "$IPA" release-assets/ReadAware-ios-arm64.ipa
          fi
          ls -la release-assets

      - name: Attach to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: ReadAware ${{ github.ref_name }}
          files: release-assets/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  desktop:
    needs: marketplace-contract
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: macos-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches the desktop app version
        shell: bash
        run: |
          APP_VERSION="$(bun -e "console.log(require('./apps/desktop/src-tauri/tauri.conf.json').version)")"
          if [ "${GITHUB_REF_NAME#v}" != "$APP_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match tauri.conf.json version $APP_VERSION" >&2
            exit 1
          fi

      - name: Require Apple signing secrets
        if: startsWith(matrix.platform, 'macos')
        run: |
          if [ -z "${{ secrets.APPLE_CERTIFICATE }}" ] \
            || [ -z "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" ] \
            || [ -z "${{ secrets.APPLE_SIGNING_IDENTITY }}" ] \
            || [ -z "${{ secrets.APPLE_API_ISSUER }}" ] \
            || [ -z "${{ secrets.APPLE_API_KEY }}" ] \
            || [ -z "${{ secrets.APPLE_API_KEY_B64 }}" ]; then
            echo "APPLE_* signing/notarization secrets are missing (see the header comment)" >&2
            exit 1
          fi

      # The tauri CLI reads the notary key from a file path (APPLE_API_KEY_PATH),
      # so the .p8 secret is materialized outside the workspace first. The path
      # itself is not secret — only the key content is, and that stays in the
      # secret store / RUNNER_TEMP.
      - name: Stage the App Store Connect API key
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
        run: |
          echo "$APPLE_API_KEY_B64" | base64 -d > "$RUNNER_TEMP/apple-api-key.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/apple-api-key.p8" >> "$GITHUB_ENV"

      - name: Build desktop bundles
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: bun run tauri build --target ${{ matrix.target }}

      # tauri signed the .app with the hardened runtime, notarized it and
      # stapled the ticket before assembling the DMG. Trust but verify: assert
      # Gatekeeper acceptance so a silently-unsigned build fails the job
      # instead of shipping.
      - name: Verify signature and notarization
        if: startsWith(matrix.platform, 'macos')
        run: |
          APP="apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/ReadAware.app"
          DMG=(apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          codesign --verify --deep --strict --verbose=2 "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=2 "$APP"
          codesign --verify --verbose=2 "${DMG[0]}"

      # One naming scheme for everything on the release page:
      #   ReadAware-vX.Y.Z-<platform>-<arch>.<ext>
      # Stable tags additionally duplicate the installers under version-less
      # aliases (ReadAware-<platform>-<arch>.<ext>): the landing page hard-codes
      # `releases/latest/download/<alias>` URLs, which GitHub resolves to the
      # newest non-prerelease release — pre-release tags therefore skip them.
      # macOS additionally ships the .app as a plain .zip alongside the .dmg;
      # Windows ships a portable .zip of the bare exe (Tauri embeds the
      # frontend, so it is self-contained; WebView2 comes with Windows 10/11 —
      # only the installers carry its bootstrapper).
      # The .app.tar.gz (+ .sig) files are the signed updater payloads that
      # latest.json points at — renamed to the same scheme, they stay per-chip.
      - name: Collect release assets
        shell: bash
        run: |
          BUNDLE="apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          BASE="ReadAware-${{ github.ref_name }}-${{ matrix.platform }}"
          mkdir -p release-assets
          case "${{ matrix.platform }}" in
            macos-*)
              cp "$BUNDLE"/dmg/*.dmg "release-assets/$BASE.dmg"
              ditto -c -k --sequesterRsrc --keepParent "$BUNDLE/macos/ReadAware.app" "release-assets/$BASE.zip"
              cp "$BUNDLE"/macos/*.app.tar.gz "release-assets/$BASE.app.tar.gz"
              cp "$BUNDLE"/macos/*.app.tar.gz.sig "release-assets/$BASE.app.tar.gz.sig"
              ;;
            linux-*)
              cp "$BUNDLE"/appimage/*.AppImage "release-assets/$BASE.AppImage"
              cp "$BUNDLE"/appimage/*.AppImage.sig "release-assets/$BASE.AppImage.sig"
              cp "$BUNDLE"/deb/*.deb "release-assets/$BASE.deb"
              cp "$BUNDLE"/deb/*.deb.sig "release-assets/$BASE.deb.sig"
              cp "$BUNDLE"/rpm/*.rpm "release-assets/$BASE.rpm"
              cp "$BUNDLE"/rpm/*.rpm.sig "release-assets/$BASE.rpm.sig"
              ;;
            windows-*)
              cp "$BUNDLE"/nsis/*-setup.exe "release-assets/$BASE-setup.exe"
              cp "$BUNDLE"/nsis/*-setup.exe.sig "release-assets/$BASE-setup.exe.sig"
              cp "$BUNDLE"/msi/*.msi "release-assets/$BASE.msi"
              cp "$BUNDLE"/msi/*.msi.sig "release-assets/$BASE.msi.sig"
              # The exe in target/ keeps its cargo name; only the installers
              # ship it renamed. Restage it as ReadAware.exe for the zip.
              EXE_DIR="apps/desktop/src-tauri/target/${{ matrix.target }}/release"
              if [ ! -f "$EXE_DIR/read-aware-desktop.exe" ]; then
                echo "portable exe not found; contents of $EXE_DIR:" >&2
                ls "$EXE_DIR" >&2
                exit 1
              fi
              mkdir -p "$RUNNER_TEMP/portable"
              cp "$EXE_DIR/read-aware-desktop.exe" "$RUNNER_TEMP/portable/ReadAware.exe"
              (cd "$RUNNER_TEMP/portable" && 7z a "$OLDPWD/release-assets/$BASE-portable.zip" ReadAware.exe)
              ;;
          esac
          if [[ "$GITHUB_REF_NAME" != *-* ]]; then
            case "${{ matrix.platform }}" in
              macos-*)
                cp "release-assets/$BASE.dmg" "release-assets/ReadAware-${{ matrix.platform }}.dmg"
                ;;
              linux-*)
                cp "release-assets/$BASE.AppImage" release-assets/ReadAware-linux-x64.AppImage
                cp "release-assets/$BASE.deb" release-assets/ReadAware-linux-x64.deb
                cp "release-assets/$BASE.rpm" release-assets/ReadAware-linux-x64.rpm
                ;;
              windows-*)
                cp "release-assets/$BASE-setup.exe" release-assets/ReadAware-windows-x64-setup.exe
                cp "release-assets/$BASE.msi" release-assets/ReadAware-windows-x64.msi
                cp "release-assets/$BASE-portable.zip" release-assets/ReadAware-windows-x64-portable.zip
                ;;
            esac
          fi
          ls -la release-assets

      - name: Attach to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: ReadAware ${{ github.ref_name }}
          files: release-assets/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  # latest.json must exist once, after every desktop artifact is uploaded —
  # composing it in a dedicated job avoids the cross-job merge races the
  # per-job approach would have. Mirrors the platform-key shape tauri-action
  # produced, with darwin split per chip now that universal is gone.
  updater-manifest:
    needs: desktop
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Compose and upload latest.json
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          mkdir sigs && cd sigs
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.sig'
          cd ..
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" TAG="$TAG" VERSION="$VERSION" BASE_URL="$BASE_URL" python3 - <<'EOF'
          import json, os

          tag = os.environ["TAG"]
          base = os.environ["BASE_URL"]

          def entry(name):
              with open(f"sigs/{name}.sig", encoding="utf-8") as f:
                  return {"signature": f.read(), "url": f"{base}/{name}"}

          arm = entry(f"ReadAware-{tag}-macos-arm64.app.tar.gz")
          intel = entry(f"ReadAware-{tag}-macos-x64.app.tar.gz")
          appimage = entry(f"ReadAware-{tag}-linux-x64.AppImage")
          deb = entry(f"ReadAware-{tag}-linux-x64.deb")
          rpm = entry(f"ReadAware-{tag}-linux-x64.rpm")
          msi = entry(f"ReadAware-{tag}-windows-x64.msi")
          nsis = entry(f"ReadAware-{tag}-windows-x64-setup.exe")

          manifest = {
              "version": os.environ["VERSION"],
              "notes": "",
              "pub_date": os.environ["PUB_DATE"],
              "platforms": {
                  "darwin-aarch64": arm,
                  "darwin-x86_64": intel,
                  "linux-x86_64": appimage,
                  "linux-x86_64-appimage": appimage,
                  "linux-x86_64-deb": deb,
                  "linux-x86_64-rpm": rpm,
                  "windows-x86_64": msi,
                  "windows-x86_64-msi": msi,
                  "windows-x86_64-nsis": nsis,
              },
          }
          with open("latest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
          EOF
          python3 -m json.tool latest.json
          gh release upload "$TAG" latest.json --repo "$GITHUB_REPOSITORY" --clobber
