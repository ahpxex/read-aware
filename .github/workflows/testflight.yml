# iOS to public TestFlight: build an App Store-signed IPA for a stable version
# tag, upload it to App Store Connect, and hand it to public beta review
# (scripts/testflight.ts: wait for processing, What to Test, the external group
# with the public invitation link, Beta App Review submission).
#
# release.yml calls this for every stable tag; pre-release tags never reach
# the public beta. Run it by hand (Actions → testflight → Run workflow) to
# retry a release's TestFlight step, or with mode "sign" to prove that signing
# still works without uploading anything.
#
# Signing is Xcode's automatic signing authenticated by the App Store Connect
# API key, through the tauri CLI: with APPLE_API_ISSUER, APPLE_API_KEY and
# APPLE_API_KEY_PATH set it archives unsigned and signs at export with the
# cloud-managed Apple Distribution certificate, so the runner needs no
# certificate or provisioning profile of its own. The key is the one
# release.yml already uses for macOS notarization (same three secrets).
#
# Every upload gets its own build number (CFBundleVersion), the UTC date and
# second of day ("20261118.71523"): App Store Connect refuses a build number it
# has seen for that version, and a re-run, a manual dispatch or a re-cut tag
# must still upload. The marketing version (CFBundleShortVersionString) stays
# the tag's version.
name: testflight

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      APPLE_API_ISSUER:
        required: true
      APPLE_API_KEY:
        required: true
      APPLE_API_KEY_B64:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Stable version tag to build (e.g. v0.6.11)
        required: true
        type: string
      mode:
        description: "testflight: build, upload and submit for beta review. sign: build and verify the signature only."
        required: true
        default: testflight
        type: choice
        options:
          - testflight
          - sign

concurrency:
  group: testflight-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      MODE: ${{ inputs.mode || 'testflight' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.98.1"
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"
          key: aarch64-apple-ios

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify the tag and choose the build number
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "TestFlight takes stable version tags only (got $RELEASE_TAG)" >&2
            exit 1
          fi
          APP_VERSION="$(bun -e "console.log(require('./apps/desktop/src-tauri/tauri.conf.json').version)")"
          PLIST="apps/desktop/src-tauri/gen/apple/read-aware-desktop_iOS/Info.plist"
          IOS_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"
          if [ "${RELEASE_TAG#v}" != "$APP_VERSION" ] || [ "${RELEASE_TAG#v}" != "$IOS_VERSION" ]; then
            echo "Tag $RELEASE_TAG does not match tauri.conf.json ($APP_VERSION) and Info.plist ($IOS_VERSION)" >&2
            exit 1
          fi
          NOW="$(date -u +%s)"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$(date -u -r "$NOW" +%Y%m%d).$((NOW % 86400))" >> "$GITHUB_ENV"

      # altool looks for AuthKey_<key id>.p8 in $API_PRIVATE_KEYS_DIR; the tauri
      # CLI and scripts/testflight.ts take the file's path.
      - name: Install the App Store Connect API key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
        run: |
          if [ -z "$APPLE_API_KEY" ] || [ -z "$APPLE_API_KEY_B64" ]; then
            echo "APPLE_API_KEY / APPLE_API_KEY_B64 secrets are missing" >&2
            exit 1
          fi
          KEYS_DIR="$RUNNER_TEMP/private_keys"
          mkdir -p "$KEYS_DIR"
          echo "$APPLE_API_KEY_B64" | base64 -d > "$KEYS_DIR/AuthKey_$APPLE_API_KEY.p8"
          echo "API_PRIVATE_KEYS_DIR=$KEYS_DIR" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=$KEYS_DIR/AuthKey_$APPLE_API_KEY.p8" >> "$GITHUB_ENV"

      - name: Build the App Store IPA
        working-directory: apps/desktop
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          bun run tauri ios build --export-method app-store-connect --ci \
            -c "{\"bundle\":{\"iOS\":{\"bundleVersion\":\"$BUILD_NUMBER\"}}}"

      # The App Store build's source maps. Frontend builds are reproducible, so
      # the release's ios-arm64 archive normally covers this build too; this
      # copy (kept 90 days) answers the case where the hashes differ.
      - name: Keep the source maps
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sourcemaps-ios-appstore-${{ env.RELEASE_TAG }}
          path: apps/web/sourcemaps
          retention-days: 90

      # The tauri CLI runs xcodebuild with -quiet, so an archive or export
      # failure hides the real error. The activity logs have it.
      - name: Dump Xcode activity logs on failure
        if: failure()
        run: |
          find "$HOME/Library/Developer/Xcode/DerivedData" -name "*.xcactivitylog" 2>/dev/null | while read -r log; do
            echo "=== $log ==="
            gunzip -c "$log" | tr '\r' '\n' | tail -300 || true
          done

      # The same signature a locally exported App Store build carries: Apple
      # Distribution for the team, an App Store profile (no device list), and
      # release entitlements that TestFlight accepts.
      - name: Verify the signature
        run: |
          IPA="apps/desktop/src-tauri/gen/apple/build/arm64/ReadAware.ipa"
          unzip -q "$IPA" -d "$RUNNER_TEMP/ipa"
          APP="$RUNNER_TEMP/ipa/Payload/ReadAware.app"
          fail() { echo "$1" >&2; exit 1; }
          codesign --verify --strict "$APP" || fail "the app's signature does not verify"
          codesign -dvv "$APP" 2>&1 | grep -q '^Authority=Apple Distribution: .*(L7GVXT64TV)$' \
            || fail "not signed with the team's Apple Distribution certificate"
          security cms -D -i "$APP/embedded.mobileprovision" > "$RUNNER_TEMP/profile.plist" \
            || fail "no embedded provisioning profile"
          if plutil -extract ProvisionedDevices raw "$RUNNER_TEMP/profile.plist" >/dev/null 2>&1; then
            fail "the profile lists devices, so it is not an App Store profile"
          fi
          codesign -d --entitlements - --xml "$APP" > "$RUNNER_TEMP/entitlements.plist" 2>/dev/null
          [ "$(plutil -extract get-task-allow raw "$RUNNER_TEMP/entitlements.plist")" = "false" ] \
            || fail "get-task-allow is not false"
          [ "$(plutil -extract application-identifier raw "$RUNNER_TEMP/entitlements.plist")" = "L7GVXT64TV.com.readaware.app" ] \
            || fail "unexpected application-identifier"
          [ "$(plutil -extract CFBundleShortVersionString raw "$APP/Info.plist")" = "$APP_VERSION" ] \
            || fail "CFBundleShortVersionString is not $APP_VERSION"
          [ "$(plutil -extract CFBundleVersion raw "$APP/Info.plist")" = "$BUILD_NUMBER" ] \
            || fail "CFBundleVersion is not $BUILD_NUMBER"
          echo "Signed $APP_VERSION ($BUILD_NUMBER) for the App Store"

      - name: Upload to App Store Connect
        if: env.MODE == 'testflight'
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          xcrun altool --upload-app -t ios \
            -f apps/desktop/src-tauri/gen/apple/build/arm64/ReadAware.ipa \
            --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"

      - name: Submit for public beta review
        if: env.MODE == 'testflight'
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: bun scripts/testflight.ts --version "$APP_VERSION" --build-number "$BUILD_NUMBER" --tag "$RELEASE_TAG"
