[package]
name = "read-aware-desktop"
version = "0.1.0"
description = "ReadAware desktop shell"
edition = "2021"
# The locked dependency graph needs 1.90 (tauri 2.12 and its plugins, muda
# 0.20); our own code needs 1.82 (Option::is_none_or, LazyLock).
# Re-derive after a lockfile bump: the max `rust_version` in `cargo metadata`.
rust-version = "1.90"

[lib]
# The `_lib` suffix avoids a name collision with the binary on Windows.
name = "read_aware_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# image-png: decode the PNG bytes the webview hands to clipboard writeImage.
tauri = { version = "2", features = ["image-png"] }
# The app's only production trace: a rotating log file in the OS log dir
# (webview logs are forwarded into the same file over IPC). Release builds have
# no console and no DevTools — without this file a failure leaves nothing to
# diagnose. Read back by diagnostics.rs for the user-initiated diagnostics
# bundle; never uploaded automatically.
log = "0.4"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# Bundled SQLite — no system dependency; compiles SQLite from source.
# `functions` lets us register ra_fts_segment (CJK bigram segmentation) as a
# SQL function so the FTS triggers can call it.
rusqlite = { version = "0.32", features = ["bundled", "functions", "backup", "hooks", "limits"] }
# Content hashes for the blob registry (dedupe, integrity, sync reconciliation).
sha2 = "0.10"
# Cover normalization (covers.rs): every extracted cover is bounded to a
# shelf-sized JPEG before it is stored or synced. Same crate tauri already
# pulls for its PNG handling; only the decoders covers can arrive in.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }
# Authenticated encryption for the stored API key (see secrets.rs). Pure Rust,
# no system dependency and no OS credential store — that trade is explained in
# the module header.
aes-gcm = "0.10"
# Existing sync-envelope v1 wire compatibility during native backup restore.
chacha20poly1305 = "0.10"
zeroize = "1"
# EPUB metadata is a few small ZIP entries (container.xml, OPF, cover). Reading
# those directly avoids opening the whole book in the webview just to paint a
# shelf cover.
zip = { version = "2.2", default-features = false, features = ["deflate"] }
# Built-in plugins are EMBEDDED in the binary and extracted to app data at
# first launch per version. Mobile has no readable resource dir (Android's
# resource_dir() is the asset:// URI, not a filesystem), so bundle.resources
# cannot carry them — the binary is the only root that exists everywhere.
include_dir = "0.7"
quick-xml = "0.39"
percent-encoding = "2"
# Stable per-install device id (HLC tiebreaker + sync attribution).
uuid = { version = "1", features = ["v4"] }
# Native OS file dialog for book import — the webview ignores HTML <input accept>.
tauri-plugin-dialog = "2"
# Filesystem access that understands mobile paths (Android content:// URIs);
# native_path::materialize routes through it so book import works on every
# platform.
tauri-plugin-fs = "2"
# Staging ground for content-URI picks: extractors and the blob copy read a
# real path, the temp file vanishes with its guard (also used by tests).
tempfile = "3"
# Full backups use standard age passphrase encryption over a streaming tar.
# No armor, SSH, plugin recipients or home-grown encryption envelope.
age = { version = "0.12.1", default-features = false }
tar = { version = "0.4", default-features = false }
# Explicit auth headers belong to each caller; never share a native cookie jar
# between plugin activations and the host's own HTTP traffic.
tauri-plugin-http = { version = "2.5.9", default-features = false, features = ["rustls-tls", "http2", "charset", "macos-system-configuration"] }
# Imported font metadata (fonts.rs): family name, weight and fvar axes live in
# SFNT tables — ttf-parser reads them. WOFF wraps those tables in per-table
# zlib streams (miniz_oxide inflates) and WOFF2 in one Brotli transform buffer;
# both decompressors already sit in the tree transitively and are pure Rust,
# so they build for Android/iOS without extra tooling.
ttf-parser = { version = "0.25.1", default-features = false, features = ["std", "variable-fonts"] }
miniz_oxide = "0.8"
brotli = "8"
# 外链交给系统浏览器（更新日志、官网）。webview 默认吞掉 target=_blank，
# 前端统一走 openExternalUrl → 本插件。
tauri-plugin-opener = "2"
# Clipboard writes the webview cannot do itself: WKWebView rejects
# navigator.clipboard.write for images (NotAllowedError), so the reader's
# image viewer copies through this plugin instead.
tauri-plugin-clipboard-manager = "2"
# readaware:// deep links (sync sign-in hand-off from the browser/email back
# into the app). Desktop scheme registration + mobile intent routing; the
# frontend consumes URLs via @tauri-apps/plugin-deep-link.
tauri-plugin-deep-link = "2"
cap-std = "4"
tokio = { version = "1", features = ["time", "net", "sync"] }
# Read-only loopback API for external agents. HTTP transport only; domain reads
# stay behind the same application query interfaces as the built-in agent.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }

# Desktop only: window-chrome helpers and the dev-time MCP bridge. Neither
# compiles for (or makes sense on) Android/iOS, where the webview is fullscreen.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Exact pin: vendor/auto-launch patches the auto-launch 0.5.0 this release
# depends on (see vendor/auto-launch/VENDOR.md). A caret upgrade could move to
# another auto-launch version and silently bypass the audited patch.
tauri-plugin-autostart = "=2.5.1"
# File associations: double-clicking a book while the app runs must reach the
# EXISTING instance (two processes would race the SQLite db). The callback
# relays the second launch's argv to external_open.
# The "deep-link" feature forwards a second launch's readaware:// argv
# (Windows/Linux deliver deep links as plain launch arguments) to the
# deep-link plugin, so warm-start links fire on_open_url like every other.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# Signed desktop release checks and installation. The updater is unsupported on
# mobile, where store-managed updates remain the platform-native path.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Already in the tree via tauri; used directly to allow-list update-manifest
# URLs (desktop_update.rs).
url = "2"
# Dev-only bridge that lets the Tauri MCP server drive/inspect the webview.
# Linked in all desktop builds (so its capability permission resolves) but only
# initialized under debug_assertions — see lib.rs.
# Vendored fork preserves background automation on clean CI checkouts.
# See vendor/tauri-plugin-mcp-bridge/READAWARE.md for provenance.
tauri-plugin-mcp-bridge = { version = "0.13.0", path = "vendor/tauri-plugin-mcp-bridge" }
# Windows: snap overlay for the custom maximize button. Do not initialize on
# macOS; Tauri's trafficLightPosition owns traffic-light placement there.
tauri-plugin-decorum = "1"

# macOS only: toggle the native traffic-light buttons for the reader's immersive
# view. Versions match the existing native input helpers.
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25"
objc = "0.2"
# ObjC block support for the NSEvent scroll-wheel monitor that feeds the reader
# real trackpad gesture phases. Same version cocoa already locks transitively.
block = "0.1"

# Windows only: DirectWrite enumeration of installed font families for the
# reader's font picker. Same `windows` version wry/tao already lock — the
# feature flags are additive, no second copy in the graph.
[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55"
windows = { version = "0.61", features = [
  "Win32_Graphics_DirectWrite",
  "Win32_Globalization",
  "Win32_UI_Shell",
] }

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }
rust-ini = "0.21.3"

[target.'cfg(target_os = "linux")'.dependencies]
rust-ini = "0.21.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Tauri's third-party dependency graph dominates target/debug when every crate
# carries full debug data. Keep ReadAware's own symbols, but omit dependency
# debug info to make local builds substantially smaller.
[profile.dev.package."*"]
debug = 0

# Hashing large imported books is user-facing even in `tauri dev`. Optimizing
# only sha2 keeps normal debug compilation fast while avoiding a 10x+ debug-mode
# penalty that made an 88 MB import take seconds instead of milliseconds.
[profile.dev.package.sha2]
opt-level = 3

# The backup KDF keeps its production work factor in dev builds. Optimize the
# CPU-heavy scrypt/Salsa20 loops so debug compilation does not multiply its cost.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3

# Same reasoning for cover normalization (covers.rs): decoding a
# print-resolution cover and resampling it to shelf size is tens of megapixels
# of arithmetic, which unoptimized dependency code turns from ~50 ms into
# seconds on every import in `tauri dev`.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.zune-core]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3

# Android only: reach MainActivity over JNI to toggle the system status bar
# for the reader's immersive view. `tao` (already in tauri's tree, same
# version) exposes the activity's JavaVM/jobject via main_android_context —
# the ndk-context crate's global is NOT initialized under tauri and panics.
# iOS only: read the App Store storefront (SKPaymentQueue.storefront) so the
# webview can gate external purchase links per Apple's storefront rules — see
# storefront.rs. Same objc2 0.5 the tauri tree already locks.
[target.'cfg(target_os = "ios")'.dependencies]
objc2-store-kit = { version = "0.2", default-features = false, features = [
  "SKPaymentQueue",
  "SKStorefront",
  "std",
] }
objc2-foundation = { version = "0.2", default-features = false, features = ["std", "NSString"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# Trust anchors for the updater's TLS. reqwest's default rustls verifier on
# Android (rustls-platform-verifier) needs a JVM context Tauri never gives it
# and panics mid-handshake, so android_update.rs builds its own rustls config
# against these bundled Mozilla roots instead.
webpki-roots = "1"
semver = "1"
tao = "0.35"

[lints.rust]
# objc 0.2's msg_send!/sel! expand `cfg(feature = "cargo-clippy")` inside this
# crate; the value belongs to that macro, not to a feature we could declare.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[patch.crates-io]
auto-launch = { path = "vendor/auto-launch" }
