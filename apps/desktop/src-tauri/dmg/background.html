<!doctype html>
<!--
  Source for the DMG background. Rendered to background.png by
  generate-background.sh (headless Chrome at 2x, then stamped to 144 dpi so
  Finder draws it at 660x300 points). Keep the geometry in sync with the
  bundle.macOS.dmg section of tauri.conf.json.
-->
<html>
<head>
<meta charset="utf-8" />
<style>
  /* Canvas is 660x300: the Finder window is 660x333 (tauri.conf.json), the
     Tahoe title bar eats 32pt, so the viewport is 301pt — the canvas stays
     1pt shorter so PNG dpi rounding can never push it into scroll overflow.
     Finder extends the scrollable extent to <icon position> + <icon cell>
     (~115x128 beyond the position): icons at {180,160} and {480,160} reach
     595x288, safely inside the 660x301 viewport. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 660px; height: 300px; }
  body {
    position: relative;
    overflow: hidden;
    background: #f5f1e8;
    font-family: Inter, -apple-system, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wordmark {
    position: absolute;
    top: 26px;
    left: 36px;
    font-family: "New York", ui-serif, Georgia, serif;
    font-size: 20px;
    letter-spacing: -0.01em;
    color: #1c1917;
  }
  .tagline {
    position: absolute;
    top: 32px;
    right: 36px;
    font-family: "New York", ui-serif, Georgia, serif;
    font-style: italic;
    font-size: 13px;
    color: #a8a29e;
  }
  .arrow {
    position: absolute;
    top: 148px;
    left: 250px;
    width: 160px;
    height: 24px;
  }
</style>
</head>
<body>
  <div class="wordmark">ReadAware</div>
  <div class="tagline">Reading that remembers.</div>

  <svg class="arrow" viewBox="0 0 160 24" fill="none">
    <line x1="4" y1="12" x2="140" y2="12" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" />
    <path d="M132 4 L148 12 L132 20" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </svg>
</body>
</html>
