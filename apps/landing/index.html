<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon.png" sizes="256x256" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f5f5f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#201d1a" media="(prefers-color-scheme: dark)" />
    <title>ReadAware — Free, Open-Source Ebook Reader That's Aware of You</title>
    <meta
      name="description"
      content="A free, open-source ebook reader for Windows, macOS, Linux, and Android. One reader for EPUB, MOBI, AZW3, FB2, CBZ, CBR, TXT, HTML, and PDF that builds memory from your reading, grows through plugins, and syncs end-to-end encrypted — local-first and private."
      data-prerender
    />
    <!-- Literata is self-hosted (src/fonts.css); preload the latin subset the
         first paint always needs. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/literata-normal-latin.woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Explicit rather than host-injected: the standalone sync/login page must
         never load third-party JavaScript that could inspect its token fragment. -->
    <script
      defer
      src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token":"85248630a3af4dea851fab0356df1f6a"}'
    ></script>
  </body>
</html>
