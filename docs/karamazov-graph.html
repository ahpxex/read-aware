爱慕者","t":"德米特里·费奥多罗维奇","at":99,"note":"卡嘉表示永远爱米嘉"},{"s":"格露莘卡","k":"爱慕者","t":"德米特里·费奥多罗维奇","at":99,"note":"格露莘卡探望米嘉"},{"s":"卡捷琳娜·伊万诺夫娜","k":"请求者","t":"格露莘卡","at":99,"note":"卡嘉请求宽恕遭拒"},{"s":"阿辽沙","k":"陪同者","t":"卡捷琳娜·伊万诺夫娜","at":99,"note":"阿辽沙追出安慰卡嘉"},{"s":"尼娜","k":"女儿","t":"斯涅吉辽夫上尉","at":100,"note":"请求父亲给母亲一朵花。"},{"s":"伊柳沙","k":"兄弟","t":"尼娜","at":100,"note":"尼娜对伊柳沙的告别时的吻。"}]};
const KIN = new Set(["父亲","母亲","儿子","女儿","兄弟","弟弟","兄长","哥哥","妻子","丈夫","长子","次子","幼子","堂兄","堂舅","侄子","私生子"]);
const svg = document.getElementById("svg"), tip = document.getElementById("tip");
const NS = "http://www.w3.org/2000/svg";
let W = 800, H = 600;
function measure(){ const r = svg.getBoundingClientRect(); W = r.width; H = r.height; }
measure(); addEventListener("resize", () => { measure(); heat = Math.max(heat, .3); });

const nodes = DATA.nodes.map(n => ({ ...n, x: 0, y: 0, vx: 0, vy: 0, deg: 0 }));
const byId = new Map(nodes.map(n => [n.id, n]));
const edges = DATA.edges.filter(e => byId.has(e.s) && byId.has(e.t));
for (const e of edges) { byId.get(e.s).deg++; byId.get(e.t).deg++; }
// 初始位置：按首次出场章节排成螺旋，主角靠中心
nodes.sort((a,b) => b.deg - a.deg).forEach((n,i) => {
  const r = 40 + 14 * Math.sqrt(i) * 4, a = i * 2.399963;
  n.x = Math.cos(a) * r; n.y = Math.sin(a) * r;
});

let through = 102, heat = 1, dragging = null, panX = 0, panY = 0, scale = 1;
const active = () => ({
  ns: nodes.filter(n => n.first <= through),
  es: edges.filter(e => e.at <= through && byId.get(e.s).first <= through && byId.get(e.t).first <= through),
});

// --- render skeleton ---
const gRoot = document.createElementNS(NS, "g"); svg.appendChild(gRoot);
const gE = document.createElementNS(NS, "g"), gN = document.createElementNS(NS, "g"), gL = document.createElementNS(NS, "g");
gRoot.append(gE, gN, gL);
const eEls = new Map(), nEls = new Map(), lEls = new Map();
for (const e of edges) {
  const el = document.createElementNS(NS, "line");
  if (KIN.has(e.k)) el.classList.add("kin");
  eEls.set(e, el); gE.appendChild(el);
}
for (const n of nodes) {
  const el = document.createElementNS(NS, "circle");
  el.setAttribute("r", Math.max(4, Math.min(16, 3 + Math.sqrt(n.m) * 2.2)));
  if (n.deg >= 15) el.classList.add("hub");
  el.addEventListener("pointerenter", ev => showTip(n, ev));
  el.addEventListener("pointerleave", () => tip.style.display = "none");
  el.addEventListener("pointerdown", ev => { dragging = n; ev.stopPropagation(); svg.setPointerCapture(ev.pointerId); });
  nEls.set(n, el); gN.appendChild(el);
  const lb = document.createElementNS(NS, "text");
  lb.classList.add("lbl"); if (n.deg >= 15) lb.classList.add("big");
  lb.textContent = n.id.length > 12 ? (n.aliases.find(a => a.length <= 6) ?? n.id.slice(0, 10) + "…") : n.id;
  lEls.set(n, lb); gL.appendChild(lb);
}
svg.addEventListener("pointermove", ev => {
  if (!dragging) return;
  const p = pt(ev); dragging.x = p.x; dragging.y = p.y; dragging.vx = dragging.vy = 0; heat = Math.max(heat, .25);
});
addEventListener("pointerup", () => dragging = null);
svg.addEventListener("wheel", ev => {
  ev.preventDefault();
  const k = Math.exp(-ev.deltaY * 0.0015); scale = Math.min(4, Math.max(.3, scale * k));
}, { passive: false });
let panning = null;
svg.addEventListener("pointerdown", ev => { if (!dragging) panning = { x: ev.clientX - panX, y: ev.clientY - panY }; });
svg.addEventListener("pointermove", ev => { if (panning && !dragging) { panX = ev.clientX - panning.x; panY = ev.clientY - panning.y; } });
addEventListener("pointerup", () => panning = null);
function pt(ev) {
  const r = svg.getBoundingClientRect();
  return { x: (ev.clientX - r.left - W/2 - panX) / scale, y: (ev.clientY - r.top - H/2 - panY) / scale };
}

function showTip(n, ev) {
  const rels = edges.filter(e => e.at <= through && (e.s === n.id || e.t === n.id))
    .sort((a,b) => a.at - b.at).slice(0, 12)
    .map(e => `<div>${e.s === n.id ? "" : e.s + " "}<span class="k">—${e.k}→</span> ${e.t === n.id ? (e.s === n.id ? e.t : "") : e.t} <span style="color:var(--muted)">#${e.at}</span></div>`)
    .join("");
  tip.innerHTML = `<div class="n">${n.id} <span style="color:var(--muted);font-weight:400">首见 #${n.first} · ${n.m} 章提及</span></div>`
    + (n.aliases.length ? `<div class="a">${n.aliases.join(" · ")}</div>` : "")
    + (n.note ? `<div class="a">${n.note}</div>` : "")
    + `<div class="rels">${rels}</div>`;
  tip.style.display = "block";
  const r = svg.getBoundingClientRect();
  tip.style.left = Math.min(ev.clientX - r.left + 16, r.width - 360) + "px";
  tip.style.top = Math.min(ev.clientY - r.top + 12, r.height - 200) + "px";
}

// --- simulation ---
function step() {
  const { ns, es } = active();
  const k = 0.9 * heat;
  // repulsion (grid-free O(n²)：170 节点足够快)
  for (let i = 0; i < ns.length; i++) for (let j = i + 1; j < ns.length; j++) {
    const a = ns[i], b = ns[j];
    let dx = a.x - b.x, dy = a.y - b.y, d2 = dx*dx + dy*dy || 1;
    if (d2 > 90000) continue;
    const f = 1500 / d2 * k;
    const d = Math.sqrt(d2);
    dx /= d; dy /= d;
    a.vx += dx * f; a.vy += dy * f; b.vx -= dx * f; b.vy -= dy * f;
  }
  for (const e of es) {
    const a = byId.get(e.s), b = byId.get(e.t);
    let dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.sqrt(dx*dx + dy*dy) || 1;
    const f = (d - 90) * 0.012 * k;
    dx /= d; dy /= d;
    a.vx += dx * f * d * .02; a.vy += dy * f * d * .02;
    b.vx -= dx * f * d * .02; b.vy -= dy * f * d * .02;
  }
  for (const n of ns) {
    n.vx -= n.x * 0.0016 * k; n.vy -= n.y * 0.0016 * k;   // gravity
    n.x += n.vx; n.y += n.vy; n.vx *= .82; n.vy *= .82;
  }
  heat = Math.max(0.02, heat * .995);
}

function draw() {
  gRoot.setAttribute("transform", `translate(${W/2 + panX},${H/2 + panY}) scale(${scale})`);
  const activeThrough = through;
  for (const [e, el] of eEls) {
    const vis = e.at <= activeThrough;
    el.style.display = vis ? "" : "none";
    if (!vis) continue;
    const a = byId.get(e.s), b = byId.get(e.t);
    el.setAttribute("x1", a.x); el.setAttribute("y1", a.y);
    el.setAttribute("x2", b.x); el.setAttribute("y2", b.y);
  }
  for (const [n, el] of nEls) {
    const vis = n.first <= activeThrough;
    el.style.display = vis ? "" : "none";
    el.classList.toggle("fresh", activeThrough - n.first <= 2 && activeThrough < 102);
    if (vis) { el.setAttribute("cx", n.x); el.setAttribute("cy", n.y); }
    const lb = lEls.get(n);
    const showLabel = vis && (n.deg >= 6 || n.m >= 4 || scale > 1.6 || activeThrough - n.first <= 2);
    lb.style.display = showLabel ? "" : "none";
    if (showLabel) { lb.setAttribute("x", n.x + 10); lb.setAttribute("y", n.y + 4); }
  }
}

const slider = document.getElementById("slider");
function refresh() {
  through = +slider.value;
  document.getElementById("ch-num").textContent = through;
  document.getElementById("chapter-label").textContent = "#" + through + " " + (DATA.titles[through] ?? "");
  const { ns, es } = active();
  document.getElementById("n-count").textContent = ns.length;
  document.getElementById("e-count").textContent = es.length;
  heat = Math.max(heat, .5);
}
slider.addEventListener("input", refresh);
refresh();
(function loop(){ step(); step(); draw(); requestAnimationFrame(loop); })();
</script>
</body>
