<!doctype html>
<!-- Adapted from create-dual-audience-docs/template.html. Fixed resource versions and SRI preserved. -->
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">
<title>{{TITLE}}</title>
<script>try{document.documentElement.classList.toggle('dark',localStorage.getItem('readaware-capability-theme')==='dark')}catch{}</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/geist@5.2.9/index.css" integrity="sha384-if8MdL2mPpInuz+gfwSqWsp0oVymAAWrxIgU35SlqXZzzjvGAQmx91Y+mMGGibpp" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/geist-mono@5.3.0/index.css" integrity="sha384-NST9F93++1eck4FnDE0yqyWiwNNfBoWDI9qHmFymatO15xmb9YIy6A3BP1wUJs2A" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1" integrity="sha384-OT3qnPBOZ0Z1BVC2R6WSI4cjBlIoSMeeZAUY8gZqaP1TgAJHbuo2gIM6KzQ8/viI" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/lucide@0.561.0/dist/umd/lucide.min.js" integrity="sha384-YS1lRbKthC7/Oeyl8nPDTO0vZvejeFLnQJuye5QwYDdJD/2toIxMci9LbHst3SGQ" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/mermaid@11.16.0/dist/mermaid.min.js" integrity="sha384-T/0lMUdJpd2S1ZHtRiofG3htU3xPCrFVeAQ1UUE2TJwlEJSV5NUwn30kP28n238E" crossorigin="anonymous"></script>
<style>
:root{--bg:#fff;--fg:#202020;--sub:#f7f7f7;--muted:#606060;--line:#ddd;--accent:#24664b}.dark{--bg:#171717;--fg:#eee;--sub:#232323;--muted:#b5b5b5;--line:#444;--accent:#93d0b5}
*{box-sizing:border-box;letter-spacing:0}html{scroll-padding-top:90px}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.75 "Geist Variable","PingFang SC",sans-serif}a{color:inherit;text-underline-offset:3px}button,input{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:4px;min-height:36px}button{cursor:pointer}button:hover{background:var(--sub)}button:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button{width:36px;display:grid;place-items:center;flex-shrink:0}button svg{width:18px;height:18px}header{position:sticky;top:0;z-index:30;display:flex;gap:18px;align-items:center;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 24px}header .brand{font-weight:650;text-decoration:none}header .spacer{flex:1}.layout{max-width:1200px;margin:auto;display:grid;grid-template-columns:180px minmax(0,1fr)}aside{position:sticky;top:61px;align-self:start;height:calc(100vh - 61px);border-right:1px solid var(--line);padding:24px 12px;overflow-y:auto}aside a{display:block;padding:7px 10px;text-decoration:none;color:var(--muted);border-radius:4px}aside a:hover,aside a.active{background:var(--sub);color:var(--fg)}main{min-width:0;padding:26px 32px 70px}h1{font-size:26px;line-height:1.4;margin:12px 0}h2{font-size:20px;margin:30px 0 12px}h3{font-size:14px;color:var(--muted);margin:20px 0 6px}p{margin:8px 0;overflow-wrap:anywhere}.meta{color:var(--muted);font-size:12px}.callout{border-left:3px solid var(--accent);padding:0 0 0 16px;margin:20px 0}.search{display:block;margin:24px 0 10px;font-size:12px;color:var(--muted)}input{display:block;width:100%;margin-top:5px;padding:8px 10px}summary{cursor:pointer;padding:13px 2px;overflow-wrap:anywhere}details{border-bottom:1px solid var(--line)}.ep-body{padding:0 12px 14px;color:var(--muted);font-size:13px}.ep-body strong{color:var(--fg)}footer{margin-top:32px;padding-top:20px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}#drawer-open,#drawer-close,#backdrop{display:none}[hidden]{display:none!important}
@media(max-width:760px){header{gap:12px;padding:12px 14px}header a{font-size:12px}.layout{display:block}main{padding:20px 16px 50px}h1{font-size:22px}aside{display:none;position:fixed;inset:0 auto 0 0;width:260px;height:100dvh;background:var(--bg);z-index:50;padding:18px}aside.open{display:block}#drawer-open,#drawer-close{display:grid}#drawer-close{margin-left:auto}#backdrop.open{display:block;position:fixed;inset:0;z-index:45;background:#0006}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
</style></head><body>
<header><button id="drawer-open" aria-label="打开目录" aria-controls="sidenav" aria-expanded="false" title="打开目录"><i data-lucide="menu"></i></button><a class="brand" href="#top">ReadAware</a><span class="spacer"></span><a href="./host-capability-matrix.html">接线现状</a><a href="./host-capability-model.md">完整契约</a><button id="theme-toggle" aria-label="切换主题" title="切换主题"><i data-lucide="sun-moon"></i></button></header>
<div class="layout"><aside id="sidenav" aria-label="目录"><button id="drawer-close" aria-label="关闭目录" title="关闭目录"><i data-lucide="x"></i></button><a href="#top">结论</a>{{NAV}}</aside><div id="backdrop"></div>
<main id="top"><p class="meta">{{DATE}} · {{STATUS}}</p><h1>{{TITLE}}</h1><p>{{CONCLUSION}}</p>
<div class="callout"><strong>统一所有权，不无限扩张权限。</strong><p>已有清单全部映射，尚未实现的入口仍明确标缺。临时计时器、复制聊天和导出格式优先组合，不为“完备”建设通用工作流或万能 API。</p></div>
<label class="search">能力 / 场景 / 边界<input id="search" type="search" placeholder="搜索 Jumper、会话、memory…" autocomplete="off"></label><p id="result-count" class="meta" aria-live="polite"></p><p id="empty" hidden>没有符合条件的条目。</p>
{{BODY}}
<footer><a href="./host-capability-model.md">完整事实与双端契约</a> · <a href="./host-capability-model.data.ts">结构化目标源</a> · <a href="./plugin-capability-baseline.html">旧基线与 GAP</a></footer></main></div>
<script>
const $=id=>document.getElementById(id),nav=$('sidenav'),opener=$('drawer-open'),mobile=()=>matchMedia('(max-width:760px)').matches,rows=Array.from(document.querySelectorAll('details.ep'));
function filter(){const terms=$('search').value.trim().toLowerCase().split(/\s+/).filter(Boolean);let n=0;for(const row of rows){const hay=(row.textContent+' '+row.dataset.searchSection).toLowerCase();row.hidden=!terms.every(t=>hay.includes(t));if(!row.hidden)n++}$('result-count').textContent=n+' / '+rows.length+' 条';$('empty').hidden=n!==0}
$('search').addEventListener('input',filter);filter();
function drawer(open){nav.classList.toggle('open',open);$('backdrop').classList.toggle('open',open);opener.setAttribute('aria-expanded',String(open));if(mobile()){document.querySelector('main').inert=open;document.querySelector('header').inert=open;nav.inert=!open}document.body.style.overflow=open?'hidden':'';if(open)$('drawer-close').focus();else opener.focus()}
opener.onclick=()=>drawer(true);$('drawer-close').onclick=()=>drawer(false);$('backdrop').onclick=()=>drawer(false);nav.onclick=e=>{if(e.target.closest('a')&&mobile())drawer(false)};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('search').value='';filter();if(nav.classList.contains('open'))drawer(false)}if(e.key==='Tab'&&nav.classList.contains('open')){const list=Array.from(nav.querySelectorAll('button,a')),first=list[0],last=list.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
function responsive(){nav.inert=mobile()&&!nav.classList.contains('open');if(!mobile()){nav.classList.remove('open');$('backdrop').classList.remove('open');document.querySelector('main').inert=false;document.querySelector('header').inert=false;document.body.style.overflow='';opener.setAttribute('aria-expanded','false')}}addEventListener('resize',responsive);responsive();
$('theme-toggle').onclick=()=>{const dark=document.documentElement.classList.toggle('dark');try{localStorage.setItem('readaware-capability-theme',dark?'dark':'light')}catch{}};
const observer=new IntersectionObserver(entries=>{for(const entry of entries)if(entry.isIntersecting)nav.querySelectorAll('a').forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+entry.target.id))},{rootMargin:'-15% 0px -70% 0px'});document.querySelectorAll('main section').forEach(s=>observer.observe(s));
function revealHash(){const target=document.getElementById(location.hash.slice(1));if(target&&target.matches('details')){$('search').value='';filter();target.open=true;target.scrollIntoView()}}addEventListener('hashchange',revealHash);revealHash();
document.querySelectorAll('[data-unit-link]').forEach(a=>a.addEventListener('click',()=>{const target=document.querySelector(a.getAttribute('href'));$('search').value='';filter();if(target)target.open=true}));
addEventListener('DOMContentLoaded',()=>{if(window.lucide)lucide.createIcons();if(window.mermaid)mermaid.initialize({startOnLoad:false,securityLevel:'strict'})});
</script></body></html>
